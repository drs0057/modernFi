services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modernfi
      POSTGRES_PASSWORD: modernfi
      POSTGRES_DB: modernfi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modernfi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
