services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modernfi
      POSTGRES_PASSWORD: modernfi
      POSTGRES_DB: modernfi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modernfi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://modernfi:modernfi@postgres:5432/modernfi
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

volumes:
  pgdata:
